apiVersion: v1
kind: Secret
metadata:
  name: deskflow-secrets
  namespace: default
  labels:
    app: deskflow
type: Opaque
stringData:
  # IMPORTANT: Replace these with actual values!
  # Base64 encode sensitive data or use a secrets management tool
  jwt-secret: "your-super-secret-jwt-key-here"
  database-url: "file:./prisma/dev.db"
  # For production, use a real database:
  # database-url: "postgresql://user:password@postgres-host:5432/deskflow"
