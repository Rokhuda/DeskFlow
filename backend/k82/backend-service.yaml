apiVersion: v1
kind: Service
metadata:
  name: deskflow-backend
  namespace: default
  labels:
    app: deskflow
    tier: backend
spec:
  type: ClusterIP  # Internal service, not exposed to outside world
  selector:
    app: deskflow
    tier: backend
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
