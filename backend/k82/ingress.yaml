apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deskflow-ingress
  namespace: default
  labels:
    app: deskflow
spec:
  rules:
  - host: deskflow.example.com  # Replace with your domain
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: deskflow-backend
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: deskflow-frontend
            port:
              number: 80
