apiVersion: apps/v1
kind: Deployment
metadata:
  name: deskflow-backend
  namespace: default
  labels:
    app: deskflow
    tier: backend
spec:
  replicas: 2  # Run 2 instances for redundancy
  selector:
    matchLabels:
      app: deskflow
      tier: backend
  template:
    metadata:
      labels:
        app: deskflow
        tier: backend
    spec:
      containers:
      - name: backend
        image: deskflow-backend:latest  # Replace with your registry image
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        
        # Environment variables for the backend
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: deskflow-secrets
              key: jwt-secret
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: deskflow-secrets
              key: database-url
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Resource limits and requests
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        
        # Volume mounts for temporary files
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      
      # Volumes for temporary storage
      volumes:
      - name: tmp
        emptyDir: {}
