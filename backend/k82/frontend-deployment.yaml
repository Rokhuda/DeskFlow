apiVersion: apps/v1
kind: Deployment
metadata:
  name: deskflow-frontend
  namespace: default
  labels:
    app: deskflow
    tier: frontend
spec:
  replicas: 2  # Run 2 instances for redundancy
  selector:
    matchLabels:
      app: deskflow
      tier: frontend
  template:
    metadata:
      labels:
        app: deskflow
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: deskflow-frontend:latest  # Replace with your registry image
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Resource limits and requests
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        
        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
