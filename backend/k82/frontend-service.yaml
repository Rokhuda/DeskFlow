apiVersion: v1
kind: Service
metadata:
  name: deskflow-frontend
  namespace: default
  labels:
    app: deskflow
    tier: frontend
spec:
  type: LoadBalancer  # Expose to external traffic
  selector:
    app: deskflow
    tier: frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
